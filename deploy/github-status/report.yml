name: Report Coolify production deployment
on:
  push:
    branches: [cowork-deployment-status]
    paths: [deployment.json]
permissions:
  contents: read
  statuses: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish production status on the deployed commit
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(gh api "repos/$GITHUB_REPOSITORY/contents/deployment.json?ref=$GITHUB_SHA" --jq .content | base64 --decode)
          sha=$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' <<<"$manifest")
          deployment=$(jq -er '.deployment | select(test("^[a-z0-9]{24}$"))' <<<"$manifest")
          status=$(jq -er '.status' <<<"$manifest")
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          case "$status" in
            finished) state=success; description="Live on cowork.iamwille.xyz"; target="https://cowork.iamwille.xyz" ;;
            failed) state=failure; description="Coolify production deployment failed" ;;
            unhealthy) state=failure; description="Coolify finished but production health could not be verified" ;;
            cancelled|canceled) state=error; description="Coolify production deployment was cancelled" ;;
            *) exit 1 ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f "context=Coolify / production" -f "state=$state" \
            -f "description=$description" -f "target_url=$target" --silent
          printf 'Coolify deployment `%s` for `%s` ended with status **%s**.\n' "$deployment" "$sha" "$status" >> "$GITHUB_STEP_SUMMARY"
