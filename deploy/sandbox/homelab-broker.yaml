apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-broker
rules:
- apiGroups: [kubevirt.io]
  resources: [virtualmachineinstances]
  resourceNames: [developer-desktop]
  verbs: [get]
- apiGroups: [subresources.kubevirt.io]
  resources: [virtualmachines/start, virtualmachines/stop]
  resourceNames: [developer-desktop]
  verbs: [update]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
- apiGroups: [""]
  resources: [pods/portforward]
  verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-broker
subjects:
- kind: ServiceAccount
  name: sandbox-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sandbox-broker
  template:
    metadata:
      labels:
        app: sandbox-broker
    spec:
      serviceAccountName: sandbox-broker
      nodeSelector:
        kubernetes.io/hostname: vm-k3s-desktop
      tolerations:
      - key: homelab.iamwille.xyz/desktop
        value: "true"
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: kubectl
        image: docker.io/library/python:3.13-slim-bookworm
        env:
        - name: KUBECTL_SHA256
          value: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
        command:
        - python3
        - -c
        - |
          import hashlib, os, urllib.request
          from pathlib import Path
          content = urllib.request.urlopen(
              "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl", timeout=45
          ).read()
          if hashlib.sha256(content).hexdigest() != os.environ["KUBECTL_SHA256"]:
              raise RuntimeError("kubectl checksum mismatch")
          path = Path("/tools/kubectl")
          path.write_bytes(content)
          path.chmod(0o555)
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tools
          mountPath: /tools
      containers:
      - name: broker
        image: docker.io/library/python:3.13-slim-bookworm
        command: [python3, /app/broker.py]
        env:
        - name: HOME
          value: /tmp
        - name: PATH
          value: /tools:/usr/local/bin:/usr/bin:/bin
        - name: COWORK_SANDBOX_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: COWORK_SANDBOX_VM
          value: developer-desktop
        - name: COWORK_SANDBOX_TOKEN
          valueFrom:
            secretKeyRef:
              name: sandbox-auth
              key: token
        - name: COWORK_SANDBOX_TLS_CERT
          value: /tls/tls.crt
        - name: COWORK_SANDBOX_TLS_KEY
          value: /tls/tls.key
        ports:
        - containerPort: 18766
        readinessProbe:
          tcpSocket:
            port: 18766
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: tools
          mountPath: /tools
          readOnly: true
        - name: broker
          mountPath: /app
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: tools
        emptyDir: {}
      - name: broker
        configMap:
          name: sandbox-broker
      - name: tls
        secret:
          secretName: sandbox-tls
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-broker
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: sandbox-broker
  ports:
  - port: 18766
    nodePort: 31866
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-broker-ingress
spec:
  podSelector:
    matchLabels:
      app: sandbox-broker
  policyTypes: [Ingress]
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.212/32
    - ipBlock:
        cidr: 10.0.0.221/32
    ports:
    - protocol: TCP
      port: 18766
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-desktop
spec:
  podSelector:
    matchLabels:
      app: developer-desktop
  policyTypes: [Ingress]
